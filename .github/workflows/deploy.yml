name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy half-way; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Formatting report: errors fail, warnings show as annotations on the PR.
      - run: node --test tests/*.test.mjs
      - run: node scripts/lint.mjs
      # Fails (non-zero exit) on any invalid article, so a broken article never deploys.
      - run: node scripts/build.mjs
        env:
          # Optional. Set under Settings > Secrets and variables > Actions to password-protect /tools/.
          AUTHORING_PASSWORD: ${{ secrets.AUTHORING_PASSWORD }}
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
